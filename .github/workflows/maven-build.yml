name: Maven Package Build

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

# Cada push lanza un job por proyecto (86 ahora mismo), asi que se cancela
# la ejecucion anterior de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Maven projects
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.find.outputs.projects }}
      count: ${{ steps.find.outputs.count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find every pom.xml
        id: find
        run: |
          set -euo pipefail

          # Un proyecto = un directorio con pom.xml versionado. Usar git ls-files
          # en vez de find deja fuera cualquier pom generado (target/, etc.).
          projects=$(git ls-files '*pom.xml' \
            | sed -e 's|/pom.xml$||' -e 's|^pom.xml$|.|' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          count=$(printf '%s' "$projects" | jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "No se ha encontrado ningun pom.xml" >&2
            exit 1
          fi

          # El limite de GitHub Actions es de 256 jobs por matriz.
          if [ "$count" -gt 256 ]; then
            echo "Hay $count proyectos y la matriz admite 256 como maximo" >&2
            exit 1
          fi

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          echo "Proyectos detectados: $count" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$projects" | jq -r '.[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  # Los 86 jobs de build comparten el mismo ~/.m2, pero en la primera
  # ejecucion de una rama la cache no existe todavia y los 86 se ponen a
  # descargar de Maven Central a la vez, que responde con HTTP 429. Este job
  # la rellena una sola vez; los de build la restauran y ya no descargan.
  warm-cache:
    name: Warm the Maven cache
    needs: discover
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          # La clave incluye este workflow: si cambia lo que descarga warm-cache,
          # hace falta una cache nueva, porque setup-java no sobrescribe una existente.
          cache-dependency-path: |
            **/pom.xml
            .github/workflows/maven-build.yml

      - name: Resolve the dependencies of every project
        env:
          PROJECTS: ${{ needs.discover.outputs.projects }}
        run: |
          set -uo pipefail
          fallos=0

          while read -r p; do
            echo "::group::$p"
            if ! mvn -B -ntp -f "$p/pom.xml" \
                -Dmaven.wagon.http.retryHandler.count=5 \
                dependency:go-offline; then
              echo "::warning title=Cache warming::No se pudieron resolver las dependencias de $p"
              fallos=$((fallos + 1))
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$PROJECTS" | jq -r '.[]')

          # Rellenar la cache es una optimizacion, no una comprobacion: el
          # veredicto lo da la matriz. Un fallo aqui no corta el flujo.
          echo "Proyectos sin resolver: $fallos" >> "$GITHUB_STEP_SUMMARY"

      # go-offline no descarga lo que surefire resuelve al lanzar los tests: su
      # provider (surefire-junit-platform) y junit-platform-launcher. Sin esto,
      # los 86 jobs de build lo piden a Maven Central a la vez y alguno recibe
      # HTTP 429. Las versiones salen de un proyecto por cada version de Spring
      # Boot que haya en el repositorio, para no tener que actualizarlas a mano.
      - name: Resolve the surefire test provider
        env:
          PROJECTS: ${{ needs.discover.outputs.projects }}
        run: |
          set -uo pipefail
          declare -A visto

          evaluar() {
            mvn -B -ntp -q -f "$1/pom.xml" help:evaluate -Dexpression="$2" -DforceStdout 2>/dev/null
          }

          while read -r p; do
            boot=$(sed -n '/<artifactId>spring-boot-starter-parent<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;q}' "$p/pom.xml")
            [ -z "$boot" ] && continue
            [ -n "${visto[$boot]:-}" ] && continue
            visto[$boot]=1

            surefire=$(evaluar "$p" maven-surefire-plugin.version)
            junit=$(evaluar "$p" junit-jupiter.version)
            echo "Spring Boot $boot ($p): surefire $surefire, JUnit $junit"

            # Con JUnit 6 el launcher lleva la misma version que Jupiter.
            for a in "org.apache.maven.surefire:surefire-junit-platform:$surefire" \
                     "org.junit.platform:junit-platform-launcher:$junit"; do
              mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 \
                dependency:get -Dartifact="$a" \
                || echo "::warning title=Cache warming::No se pudo resolver $a"
            done
          done < <(printf '%s' "$PROJECTS" | jq -r '.[]')

  build:
    name: Build - ${{ matrix.project }}
    needs: [discover, warm-cache]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Restaura la cache que dejo warm-cache: la clave que usa setup-java
      # sale del hash de los pom.xml y de este workflow,
      # identico en los 86 jobs de la misma ejecucion, asi que aciertan y no
      # vuelven a guardarla.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          # La clave incluye este workflow: si cambia lo que descarga warm-cache,
          # hace falta una cache nueva, porque setup-java no sobrescribe una existente.
          cache-dependency-path: |
            **/pom.xml
            .github/workflows/maven-build.yml

      - name: Build with Maven
        run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=3 clean verify
        working-directory: ${{ matrix.project }}

  result:
    name: All projects built
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the matrix result
        run: |
          echo "Proyectos: ${{ needs.discover.outputs.count }}"
          echo "Resultado de la matriz: ${{ needs.build.result }}"
          test "${{ needs.build.result }}" = "success"
