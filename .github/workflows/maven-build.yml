name: Maven Package Build

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

# Cada push lanza un job por proyecto (86 ahora mismo), asi que se cancela
# la ejecucion anterior de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Maven projects
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.find.outputs.projects }}
      count: ${{ steps.find.outputs.count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find every pom.xml
        id: find
        run: |
          set -euo pipefail

          # Un proyecto = un directorio con pom.xml versionado. Usar git ls-files
          # en vez de find deja fuera cualquier pom generado (target/, etc.).
          projects=$(git ls-files '*pom.xml' \
            | sed -e 's|/pom.xml$||' -e 's|^pom.xml$|.|' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          count=$(printf '%s' "$projects" | jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "No se ha encontrado ningun pom.xml" >&2
            exit 1
          fi

          # El limite de GitHub Actions es de 256 jobs por matriz.
          if [ "$count" -gt 256 ]; then
            echo "Hay $count proyectos y la matriz admite 256 como maximo" >&2
            exit 1
          fi

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          echo "Proyectos detectados: $count" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$projects" | jq -r '.[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build - ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean verify
        working-directory: ${{ matrix.project }}

  result:
    name: All projects built
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the matrix result
        run: |
          echo "Proyectos: ${{ needs.discover.outputs.count }}"
          echo "Resultado de la matriz: ${{ needs.build.result }}"
          test "${{ needs.build.result }}" = "success"
