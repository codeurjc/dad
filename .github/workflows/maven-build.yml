name: Maven Package Build

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

# Cada push lanza un job por proyecto (86 ahora mismo), asi que se cancela
# la ejecucion anterior de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Maven projects
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.find.outputs.projects }}
      count: ${{ steps.find.outputs.count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find every pom.xml
        id: find
        run: |
          set -euo pipefail

          # Un proyecto = un directorio con pom.xml versionado. Usar git ls-files
          # en vez de find deja fuera cualquier pom generado (target/, etc.).
          projects=$(git ls-files '*pom.xml' \
            | sed -e 's|/pom.xml$||' -e 's|^pom.xml$|.|' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          count=$(printf '%s' "$projects" | jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "No se ha encontrado ningun pom.xml" >&2
            exit 1
          fi

          # El limite de GitHub Actions es de 256 jobs por matriz.
          if [ "$count" -gt 256 ]; then
            echo "Hay $count proyectos y la matriz admite 256 como maximo" >&2
            exit 1
          fi

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          echo "Proyectos detectados: $count" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$projects" | jq -r '.[]' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  # Los 86 jobs de build comparten el mismo ~/.m2, pero en la primera
  # ejecucion de una rama la cache no existe todavia y los 86 se ponen a
  # descargar de Maven Central a la vez, que responde con HTTP 429. Este job
  # la rellena una sola vez; los de build la restauran y ya no descargan.
  warm-cache:
    name: Warm the Maven cache
    needs: discover
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Resolve the dependencies of every project
        env:
          PROJECTS: ${{ needs.discover.outputs.projects }}
        run: |
          set -uo pipefail
          fallos=0

          while read -r p; do
            echo "::group::$p"
            if ! mvn -B -ntp -U -f "$p/pom.xml" \
                -Dmaven.wagon.http.retryHandler.count=5 \
                dependency:go-offline; then
              echo "::warning title=Cache warming::No se pudieron resolver las dependencias de $p"
              fallos=$((fallos + 1))
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$PROJECTS" | jq -r '.[]')

          # Rellenar la cache es una optimizacion, no una comprobacion: el
          # veredicto lo da la matriz. Un fallo aqui no corta el flujo.
          echo "Proyectos sin resolver: $fallos" >> "$GITHUB_STEP_SUMMARY"

      # go-offline no resuelve lo que surefire pide en tiempo de test: el
      # proveedor de JUnit Platform y sus nueve artefactos lo bajaba cada job
      # de build por su cuenta, y uno de ellos (common-java5) es el que fallo
      # en el run 40870887229. Ejecutar los tests de un proyecto los deja en
      # la cache, y a partir de ahi ningun job tiene que pedirlos.
      #
      # Se siembra con tema_4.2/ejemplo-2 porque es el unico proyecto sin
      # Spring ni contenedores: un test, decimas de segundo. El proveedor que
      # deja es el mismo que necesitan los otros 85.
      - name: Seed the test-time artifacts
        run: |
          set -euo pipefail

          mvn -B -ntp -U -f parte_4/tema_4.2/ejemplo-2/pom.xml \
            -Dmaven.wagon.http.retryHandler.count=5 \
            test

          # A diferencia del paso anterior, aqui si hay una expectativa
          # concreta que comprobar, asi que un fallo corta: si la siembra deja
          # de sembrar en silencio, volvemos a tener 86 jobs pidiendo lo mismo
          # a Central a la vez y nadie se entera hasta que falle.
          proveedor=$HOME/.m2/repository/org/apache/maven/surefire
          if ! find "$proveedor" -name 'surefire-junit-platform-*.jar' | grep -q .; then
            echo "::error title=Cache seeding::La siembra no dejo el proveedor de surefire en la cache"
            exit 1
          fi

          echo "Artefactos de surefire en la cache:" >> "$GITHUB_STEP_SUMMARY"
          find "$proveedor" -name '*.jar' | sed "s|$proveedor/|- |" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build - ${{ matrix.project }}
    needs: [discover, warm-cache]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Restaura la cache que dejo warm-cache: la clave que usa setup-java
      # sale del hash de los ficheros de build (pom.xml y .mvn/extensions.xml),
      # identico en los 86 jobs de la misma ejecucion, asi que aciertan y no
      # vuelven a guardarla.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # -U obliga a reintentar las resoluciones que fallaron antes. Sin el,
      # una ausencia anotada en la cache compartida se convierte en un "no
      # existe" permanente para los 86 jobs, aunque el artefacto este en
      # Central. Con la cache completa no cuesta ninguna peticion extra.
      - name: Build with Maven
        run: mvn -B -ntp -U -Dmaven.wagon.http.retryHandler.count=3 clean verify
        working-directory: ${{ matrix.project }}

  result:
    name: All projects built
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the matrix result
        run: |
          echo "Proyectos: ${{ needs.discover.outputs.count }}"
          echo "Resultado de la matriz: ${{ needs.build.result }}"
          test "${{ needs.build.result }}" = "success"
