spring.application.name=balanceo-ejer1
server.port=8080

# Servidores: arranca, por ejemplo, tres instancias de balanceo-ejem1:
#   cd ../balanceo-ejem1 && mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=8081
lb.backends=http://localhost:8081,http://localhost:8082,http://localhost:8083
# round-robin | weighted | least-connections | consistent-hash
lb.strategy=round-robin
# Pesos (solo para "weighted"), en el mismo orden que lb.backends
lb.weights=1,1,1
lb.sticky=true
lb.health.path=/instance
lb.health.interval-ms=2000
