# Perfil "http": para terminación SSL en el balanceador.
# La aplicación recibe HTTP plano desde el balanceador.
server.port=8080
server.ssl.enabled=false
# Confiar en las cabeceras X-Forwarded-For / X-Forwarded-Proto que añade el
# balanceador: así request.getRemoteAddr() y request.isSecure() reflejan al
# cliente real y no al balanceador.
server.forward-headers-strategy=native
