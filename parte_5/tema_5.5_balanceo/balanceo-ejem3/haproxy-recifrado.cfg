# RE-CIFRADO (SSL bridging): el balanceador descifra (puede ver y enrutar en
# capa 7) y vuelve a cifrar hacia las instancias. El tráfico nunca va en claro
# por la red interna.
global
    maxconn 1000
    # Los logs van a la salida estándar del contenedor (docker compose logs lb)
    log stdout format raw local0

defaults
    log global
    option httplog
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend https
    bind :443 ssl crt /usr/local/etc/haproxy/certs/lb.pem
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend web

backend web
    balance roundrobin
    cookie SERVERID insert indirect nocache dynamic
    dynamic-cookie-key clave-del-ejemplo
    option httpchk GET /
    # "ssl verify none": cifra hacia la instancia pero no valida su certificado
    # (autofirmado). En producción: "ssl verify required ca-file ..."
    server-template web 10 web:8443 ssl verify none check resolvers docker init-addr none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
