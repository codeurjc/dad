# SSL PASSTHROUGH: el balanceador NO descifra. Reenvía los bytes TLS tal cual
# (modo TCP, capa 4) y es cada instancia la que tiene el certificado.
global
    maxconn 1000
    # Los logs van a la salida estándar del contenedor (docker compose logs lb)
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend https
    bind :443
    # Esperamos al ClientHello de TLS para poder leer el SNI (el nombre de
    # servidor que pide el cliente, que viaja SIN cifrar en el saludo TLS)
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    # Enrutado por SNI: lo único de "capa 7" que se puede hacer sin descifrar
    use_backend web if { req_ssl_sni -i app.localhost }
    default_backend web

backend web
    mode tcp
    # No podemos leer cookies (van cifradas): la afinidad se hace por IP de origen
    balance source
    # Comprobación de salud: que el servidor complete un saludo TLS
    option ssl-hello-chk
    server-template web 10 web:8443 check resolvers docker init-addr none

listen stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
