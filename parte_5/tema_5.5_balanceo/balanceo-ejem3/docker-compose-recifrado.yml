# Re-cifrado: certificado en el balanceador Y en las instancias.
#   ./generate-cert.sh
#   docker compose -f docker-compose-recifrado.yml up --build
#   curl -k https://localhost:8443/
services:
  web:
    build: .
    expose:
      - "8443"
    deploy:
      replicas: 3
  lb:
    image: haproxy:3.1
    ports:
      - "8443:443"
      - "8404:8404"
    volumes:
      - "./haproxy-recifrado.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - "./certs:/usr/local/etc/haproxy/certs:ro"
    depends_on:
      - web
