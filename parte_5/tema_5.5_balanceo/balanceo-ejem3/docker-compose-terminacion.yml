# Terminación SSL: el certificado lo tiene el balanceador; las instancias hablan HTTP.
#   ./generate-cert.sh
#   docker compose -f docker-compose-terminacion.yml up --build
#   curl -k https://localhost:8443/
#   curl -kL http://localhost:8080/   (redirige a https://localhost:8443/)
services:
  web:
    build: .
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=http
    deploy:
      replicas: 3
  lb:
    image: haproxy:3.1
    ports:
      - "8443:443"
      - "8080:80"
      - "8404:8404"
    volumes:
      - "./haproxy-terminacion.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - "./certs:/usr/local/etc/haproxy/certs:ro"
    depends_on:
      - web
