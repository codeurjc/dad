# TERMINACIÓN SSL (SSL offloading): el balanceador descifra con SU certificado
# y habla HTTP plano con las instancias (capa 7: cookies, cabeceras, rutas...).
global
    maxconn 1000
    # Los logs van a la salida estándar del contenedor (docker compose logs lb)
    log stdout format raw local0

defaults
    log global
    option httplog
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend https
    bind :443 ssl crt /usr/local/etc/haproxy/certs/lb.pem
    # Redirige HTTP a HTTPS. No basta con "redirect scheme https": conserva el
    # puerto de la peticion (8080, que es HTTP) y la negociacion TLS falla. Hay
    # que mandar al cliente al puerto publico de HTTPS, el 8443 del compose.
    bind :80
    http-request redirect location https://%[req.hdr(host),host_only]:8443%[capture.req.uri] unless { ssl_fc }
    # Contamos a la aplicación quién es el cliente y cómo llegó
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend web

backend web
    balance roundrobin
    # Al estar en capa 7 podemos volver a usar sticky sessions por cookie
    cookie SERVERID insert indirect nocache dynamic
    dynamic-cookie-key clave-del-ejemplo
    option httpchk GET /
    server-template web 10 web:8080 check resolvers docker init-addr none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
