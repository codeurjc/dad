# Round robin: cada petición va a la siguiente instancia
global
    maxconn 1000
    # Los logs van a la salida estándar del contenedor (docker compose logs lb)
    log stdout format raw local0

defaults
    log global
    option httplog
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Docker Compose resuelve el nombre "web" a las IPs de TODAS las réplicas.
# HAProxy pregunta periódicamente al DNS interno de Docker y añade o quita
# servidores si cambia el número de réplicas (docker compose up --scale web=5).
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend http
    bind :80
    default_backend web

backend web
    balance roundrobin
    option httpchk GET /instance
    # Hasta 10 servidores web1..web10 rellenados con lo que devuelva el DNS
    server-template web 10 web:8080 check resolvers docker init-addr none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
