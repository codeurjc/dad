# Sticky sessions con cookie insertada por el balanceador
global
    maxconn 1000
    # Los logs van a la salida estándar del contenedor (docker compose logs lb)
    log stdout format raw local0

defaults
    log global
    option httplog
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend http
    bind :80
    default_backend web

backend web
    balance roundrobin
    option httpchk GET /instance
    # HAProxy añade la cookie SERVERID a la primera respuesta indicando qué
    # servidor atendió. En las siguientes peticiones lee la cookie y manda la
    # petición al mismo servidor.
    #   insert   -> la cookie la crea HAProxy (la aplicación no sabe nada)
    #   indirect -> la cookie no se reenvía a la aplicación
    #   nocache  -> evita que una caché intermedia comparta la cookie
    #   dynamic  -> el valor se calcula a partir de la IP del servidor (necesario
    #               con server-template, porque los servidores no tienen nombre fijo)
    cookie SERVERID insert indirect nocache dynamic
    dynamic-cookie-key clave-del-ejemplo
    # Si el servidor de la cookie cae, la petición va a otro (y se pierde la sesión)
    option redispatch
    server-template web 10 web:8080 check resolvers docker init-addr none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
