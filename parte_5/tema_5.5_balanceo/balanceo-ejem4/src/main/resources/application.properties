spring.application.name=balanceo-ejem4

# Requisitos para que una instancia sea "elástica":
# 1. Apagado ordenado: al recibir SIGTERM deja de aceptar peticiones nuevas
#    y termina las que tiene en curso (hasta 20 s) antes de parar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 2. Sondas de salud para el orquestador:
#    /actuator/health/liveness  -> ¿está viva? (si no, reiníciala)
#    /actuator/health/readiness -> ¿puede recibir tráfico? (si no, sácala del balanceo)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
