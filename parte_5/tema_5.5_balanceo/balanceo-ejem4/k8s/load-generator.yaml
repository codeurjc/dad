# Generador de carga: 4 pods que llaman en bucle a /work.
#   kubectl apply -f load-generator.yaml     (empieza la carga)
#   kubectl delete -f load-generator.yaml    (termina la carga)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- 'http://work/work?ms=200' > /dev/null; done"]
