<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <style>.t{font-size:15px;font-weight:bold;text-anchor:middle}.c{font-family:monospace;font-size:13px}</style>
  <rect x="30" y="20" width="130" height="380" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text class="t" x="95" y="45">Navegador</text>
  <rect x="440" y="20" width="140" height="380" rx="10" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2"/><text class="t" x="510" y="45">HAProxy</text>
  <g><rect x="780" y="40" width="180" height="60" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/><text class="t" x="870" y="76">web1</text>
  <rect x="780" y="170" width="180" height="60" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="3"/><text class="t" x="870" y="200">web2</text><text x="870" y="218" font-size="12" text-anchor="middle">sesión: visitas=3</text>
  <rect x="780" y="300" width="180" height="60" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/><text class="t" x="870" y="336">web3</text></g>
  <!-- 1 -->
  <line x1="160" y1="85" x2="436" y2="85" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="170" y="78" class="c">1. GET /   (sin cookie)</text>
  <line x1="580" y1="95" x2="776" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="600" y="120" font-size="13">round robin → web2</text>
  <line x1="436" y1="150" x2="164" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="170" y="142" class="c">2. Set-Cookie: SERVERID=web2</text>
  <!-- 3 -->
  <line x1="160" y1="245" x2="436" y2="245" stroke="#1e8449" stroke-width="2.5" marker-end="url(#a)"/><text x="170" y="238" class="c" fill="#1e8449">3. GET /  Cookie: SERVERID=web2</text>
  <line x1="580" y1="245" x2="776" y2="210" stroke="#1e8449" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="262" font-size="13" fill="#1e8449">lee la cookie → web2</text>
  <text x="510" y="320" text-anchor="middle" font-size="13">la cookie NO llega</text><text x="510" y="338" text-anchor="middle" font-size="13">a la aplicación</text><text x="510" y="356" text-anchor="middle" font-size="12" fill="#666" font-family="monospace">(indirect)</text>
  <text x="95" y="320" text-anchor="middle" font-size="13" fill="#c0392b">si web2 cae:</text><text x="95" y="338" text-anchor="middle" font-size="13" fill="#c0392b">otro servidor,</text><text x="95" y="356" text-anchor="middle" font-size="13" fill="#c0392b">sesión perdida</text>
</svg>
