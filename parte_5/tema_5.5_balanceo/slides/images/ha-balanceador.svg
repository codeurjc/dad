<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <style>.t{font-size:15px;font-weight:bold;text-anchor:middle}.n{font-size:13px;text-anchor:middle;fill:#444}</style>
  <rect x="40" y="150" width="120" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text class="t" x="100" y="186">Clientes</text>
  <ellipse cx="330" cy="180" rx="95" ry="38" fill="#fef9e7" stroke="#b7950b" stroke-width="2.5"/><text class="t" x="330" y="176">IP virtual</text><text class="n" x="330" y="196">192.168.1.100</text>
  <line x1="160" y1="180" x2="232" y2="180" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="490" y="60" width="170" height="70" rx="10" fill="#e8f8f5" stroke="#1e8449" stroke-width="3"/><text class="t" x="575" y="90">HAProxy 1</text><text class="n" x="575" y="110">MASTER (tiene la IP)</text>
  <rect x="490" y="230" width="170" height="70" rx="10" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="7 5"/><text class="t" x="575" y="260">HAProxy 2</text><text class="n" x="575" y="280">BACKUP (en espera)</text>
  <line x1="420" y1="168" x2="486" y2="105" stroke="#1e8449" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="420" y1="192" x2="486" y2="255" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M600,130 L600,228" stroke="#b7950b" stroke-width="2" stroke-dasharray="4 4"/><text x="610" y="172" font-size="12" fill="#7d6608">keepalived (VRRP):</text><text x="610" y="188" font-size="12" fill="#7d6608">"¿sigues vivo?"</text>
  <g><rect x="790" y="40" width="160" height="50" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/><text class="t" x="870" y="70">web1</text>
  <rect x="790" y="155" width="160" height="50" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/><text class="t" x="870" y="185">web2</text>
  <rect x="790" y="270" width="160" height="50" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/><text class="t" x="870" y="300">web3</text></g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)"><line x1="660" y1="90" x2="786" y2="65"/><line x1="660" y1="100" x2="786" y2="178"/><line x1="660" y1="110" x2="786" y2="290"/></g>
  <text x="500" y="355" text-anchor="middle" font-size="14" fill="#333">Si el MASTER cae, el BACKUP se queda la IP virtual en 1-2 segundos: los clientes no cambian nada</text>
</svg>
