# Perfil "json": logs estructurados (formato Elastic Common Schema), como en producción.
# Arranca con: mvn spring-boot:run -Dspring-boot.run.profiles=json
# Otros formatos: logstash, gelf
logging.structured.format.console=ecs
logging.structured.ecs.service.version=1.0.0
logging.structured.ecs.service.environment=desarrollo
