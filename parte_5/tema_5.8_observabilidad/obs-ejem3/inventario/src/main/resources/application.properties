spring.application.name=inventario
server.port=8081

# Muestrear el 100 % de las peticiones (por defecto, el 10 %). En producción,
# con mucho tráfico, se muestrea una fracción.
management.tracing.sampling.probability=1.0

# Exportar trazas y métricas por OTLP (OpenTelemetry Protocol) al colector.
# En Docker Compose se sobrescriben con variables de entorno.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s

# El traceId y el spanId se añaden a cada línea de log: de un log se salta a la traza
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] 
logging.include-application-name=false
