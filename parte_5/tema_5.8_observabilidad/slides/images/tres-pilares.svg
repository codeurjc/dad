<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <style>.h{font-size:22px;font-weight:bold;text-anchor:middle}.q{font-size:15px;text-anchor:middle;font-style:italic}.c{font-family:monospace;font-size:11.5px}.n{font-size:13px}</style>
  <!-- logs -->
  <rect x="15" y="15" width="310" height="360" rx="14" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2.5"/>
  <text x="170" y="50" class="h" fill="#7d3c98">Logs</text>
  <text x="170" y="75" class="q">¿qué ha pasado exactamente?</text>
  <rect x="30" y="95" width="280" height="120" rx="6" fill="#fff" stroke="#ccc"/>
  <g class="c"><text x="38" y="115">{"@timestamp":"10:15:30.120",</text><text x="38" y="132"> "log.level":"WARN",</text><text x="38" y="149"> "message":"Pago rechazado",</text><text x="38" y="166"> "orderId":"P-4821",</text><text x="38" y="183"> "traceId":"4bf92f3577b34da6",</text><text x="38" y="200"> "service.name":"pagos"}</text></g>
  <g class="n"><text x="35" y="245">• Eventos discretos con detalle</text><text x="35" y="270">• Estructurados (JSON) y con</text><text x="35" y="288">  identificador de correlación</text><text x="35" y="313">• Caros de almacenar a gran escala</text><text x="35" y="338">• Loki, Elasticsearch, OpenSearch</text></g>
  <!-- metricas -->
  <rect x="345" y="15" width="310" height="360" rx="14" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text x="500" y="50" class="h" fill="#1f4e79">Métricas</text>
  <text x="500" y="75" class="q">¿cómo está el sistema?</text>
  <rect x="360" y="95" width="280" height="120" rx="6" fill="#fff" stroke="#ccc"/>
  <polyline points="370,190 400,180 430,185 460,170 490,175 520,140 550,110 580,150 610,160 630,155" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="370" y1="130" x2="630" y2="130" stroke="#ca6f1e" stroke-dasharray="5 4"/><text x="560" y="125" font-size="11" fill="#ca6f1e">umbral de alerta</text>
  <text x="370" y="208" class="c" font-size="10.5">p95(http_server_requests_seconds)</text>
  <g class="n"><text x="365" y="245">• Números agregados en el tiempo</text><text x="365" y="270">• Baratas: tamaño fijo aunque</text><text x="365" y="288">  crezca el tráfico</text><text x="365" y="313">• Base de paneles y alertas</text><text x="365" y="338">• Prometheus, Micrometer</text></g>
  <!-- trazas -->
  <rect x="675" y="15" width="310" height="360" rx="14" fill="#fef5e7" stroke="#ca6f1e" stroke-width="2.5"/>
  <text x="830" y="50" class="h" fill="#ca6f1e">Trazas</text>
  <text x="830" y="75" class="q">¿dónde se va el tiempo?</text>
  <rect x="690" y="95" width="280" height="120" rx="6" fill="#fff" stroke="#ccc"/>
  <g><rect x="700" y="105" width="255" height="16" rx="3" fill="#1f4e79"/><text x="705" y="117" font-size="10" fill="#fff">tienda POST /purchase</text>
  <rect x="712" y="128" width="40" height="16" rx="3" fill="#1e8449"/><rect x="755" y="128" width="170" height="16" rx="3" fill="#c0392b"/><text x="760" y="140" font-size="10" fill="#fff">inventario GET /stock</text>
  <rect x="760" y="151" width="22" height="16" rx="3" fill="#7d3c98"/><rect x="785" y="151" width="135" height="16" rx="3" fill="#7d3c98"/><text x="790" y="163" font-size="10" fill="#fff">almacén externo</text>
  <rect x="930" y="128" width="20" height="16" rx="3" fill="#ca6f1e"/></g>
  <g class="n"><text x="695" y="245">• El recorrido de UNA petición</text><text x="695" y="263">  por todos los servicios</text><text x="695" y="288">• Árbol de spans con tiempos</text><text x="695" y="313">• Se muestrean (no todas)</text><text x="695" y="338">• OpenTelemetry, Tempo, Jaeger</text></g>
  <text x="500" y="408" font-size="14" text-anchor="middle" fill="#333">El poder está en saltar de uno a otro: alerta (métrica) → traza lenta → logs de esa traza</text>
</svg>
