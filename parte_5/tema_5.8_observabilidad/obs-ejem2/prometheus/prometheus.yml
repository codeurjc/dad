# Prometheus consulta (scrape) periódicamente el endpoint de métricas de la aplicación
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: tienda
    metrics_path: /actuator/prometheus
    # Docker Compose resuelve "tienda" a todas las réplicas
    dns_sd_configs:
      - names: [tienda]
        type: A
        port: 8080
