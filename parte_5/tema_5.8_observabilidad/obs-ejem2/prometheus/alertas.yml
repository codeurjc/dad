# Reglas de alerta: Prometheus las evalúa continuamente. Visibles en http://localhost:9090/alerts
groups:
  - name: tienda
    rules:
      # RED: tasa de Errores
      - alert: MuchosErrores
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/orders", status=~"5.."}[1m]))
            /
          sum(rate(http_server_requests_seconds_count{uri="/orders"}[1m])) > 0.10
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Más del 10 % de los pedidos fallan"

      # RED: Duración (percentil 95)
      - alert: LatenciaAlta
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri="/orders"}[1m]))) > 0.5
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "El 5 % más lento de los pedidos tarda más de 500 ms"

      - alert: InstanciaCaida
        expr: up{job="tienda"} == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Prometheus no puede leer las métricas de {{ $labels.instance }}"
