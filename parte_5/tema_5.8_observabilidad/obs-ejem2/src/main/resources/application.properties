spring.application.name=tienda

# Endpoints de Actuator expuestos por HTTP. /actuator/prometheus es el que lee Prometheus.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Histograma de latencias de las peticiones HTTP: permite calcular percentiles
# (p95, p99) en Prometheus agregando todas las instancias.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
