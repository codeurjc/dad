<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>.h{font-size:19px;font-weight:bold}.c{font-family:monospace;font-size:13px}.ev{fill:#ffb74d;stroke:#e65100;stroke-width:1.5}</style>
  <text x="20" y="35" class="h" fill="#555">Modelo tradicional: guardamos el estado actual</text>
  <rect x="20" y="50" width="420" height="70" fill="#fff" stroke="#999" stroke-width="2"/>
  <line x1="20" y1="80" x2="440" y2="80" stroke="#999"/><line x1="160" y1="50" x2="160" y2="120" stroke="#999"/><line x1="300" y1="50" x2="300" y2="120" stroke="#999"/>
  <g class="c" font-weight="bold"><text x="30" y="71">cuenta</text><text x="170" y="71">titular</text><text x="310" y="71">saldo</text></g>
  <g class="c"><text x="30" y="106">ES1</text><text x="170" y="106">Ana</text><text x="310" y="106">75</text></g>
  <text x="460" y="80" font-size="14" fill="#7b241c">¿Por qué tiene 75? ¿Cuánto tenía ayer?</text>
  <text x="460" y="100" font-size="14" fill="#7b241c">Cada UPDATE borra la historia.</text>

  <text x="20" y="170" class="h" fill="#e65100">Event sourcing: guardamos la secuencia de eventos</text>
  <g>
    <rect class="ev" x="20" y="190" width="170" height="70" rx="6"/><text x="30" y="210" font-size="11" fill="#7f3300">v1</text><text class="c" x="105" y="228" text-anchor="middle">CuentaAbierta</text><text class="c" x="105" y="247" text-anchor="middle">Ana</text>
    <rect class="ev" x="205" y="190" width="170" height="70" rx="6"/><text x="215" y="210" font-size="11" fill="#7f3300">v2</text><text class="c" x="290" y="228" text-anchor="middle">DineroIngresado</text><text class="c" x="290" y="247" text-anchor="middle">+100</text>
    <rect class="ev" x="390" y="190" width="170" height="70" rx="6"/><text x="400" y="210" font-size="11" fill="#7f3300">v3</text><text class="c" x="475" y="228" text-anchor="middle">DineroRetirado</text><text class="c" x="475" y="247" text-anchor="middle">-30</text>
    <rect class="ev" x="575" y="190" width="170" height="70" rx="6"/><text x="585" y="210" font-size="11" fill="#7f3300">v4</text><text class="c" x="660" y="228" text-anchor="middle">DineroIngresado</text><text class="c" x="660" y="247" text-anchor="middle">+5</text>
    <rect x="760" y="190" width="60" height="70" rx="6" fill="#fff" stroke="#e65100" stroke-dasharray="5 4"/><text x="790" y="232" font-size="18" text-anchor="middle" fill="#e65100">…</text>
  </g>
  <text x="840" y="220" font-size="13" fill="#555">solo se añade</text><text x="840" y="238" font-size="13" fill="#555">al final</text><text x="840" y="256" font-size="13" fill="#555">(append-only)</text>
  <!-- replay -->
  <path d="M100,262 C100,320 260,330 340,330" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="345" y="305" width="340" height="50" rx="8" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="515" y="327" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f4e79">replay → saldo = 75</text>
  <text x="515" y="345" font-size="12" text-anchor="middle" fill="#1f4e79">reproducir hasta v2 → saldo = 100 (viaje en el tiempo)</text>
  <text x="20" y="385" font-size="13" fill="#555">El estado actual es una función de los eventos: estado = eventos.reduce(aplicar)</text>
</svg>
