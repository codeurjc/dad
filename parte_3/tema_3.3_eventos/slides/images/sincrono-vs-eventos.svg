<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca6f1e"/></marker>
  </defs>
  <style>.s{fill:#fff;stroke-width:2.5}.t{font-size:16px;text-anchor:middle;font-weight:bold}.n{font-size:13px;fill:#555;text-anchor:middle}</style>
  <!-- izquierda -->
  <text x="235" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#b03a2e">Llamadas síncronas (REST)</text>
  <rect class="s" x="20" y="70" width="140" height="60" rx="10" stroke="#1f4e79"/><text class="t" x="90" y="106">Pedidos</text>
  <rect class="s" x="310" y="70" width="140" height="60" rx="10" stroke="#555"/><text class="t" x="380" y="106">Inventario</text>
  <rect class="s" x="310" y="190" width="140" height="60" rx="10" stroke="#555"/><text class="t" x="380" y="226">Notificaciones</text>
  <rect class="s" x="310" y="310" width="140" height="60" rx="10" stroke="#555" stroke-dasharray="6 4"/><text class="t" x="380" y="346" fill="#999">Facturación</text>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#a)" fill="none">
    <line x1="160" y1="100" x2="306" y2="100"/>
    <path d="M140,130 L306,215"/>
    <path d="M110,130 L306,335"/>
  </g>
  <text x="233" y="90" class="n">POST /stock</text>
  <text x="200" y="192" class="n">POST /emails</text>
  <text x="160" y="285" class="n">POST /invoices</text>
  <text x="380" y="388" font-size="34" fill="#c0392b" text-anchor="middle" font-weight="bold">✘</text>
  <g font-size="14" fill="#7b241c">
    <text x="20" y="420">• Pedidos conoce a todos sus "interesados"</text>
    <text x="20" y="440">• Si uno está caído o lento, el pedido falla o tarda</text>
    <text x="20" y="460">• Añadir un interesado nuevo = cambiar Pedidos</text>
  </g>
  <line x1="490" y1="50" x2="490" y2="460" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- derecha -->
  <text x="755" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e6b3a">Eventos (publicación/suscripción)</text>
  <rect class="s" x="520" y="190" width="140" height="60" rx="10" stroke="#1f4e79"/><text class="t" x="590" y="226">Pedidos</text>
  <rect x="690" y="175" width="100" height="90" rx="12" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2.5"/>
  <text class="t" x="740" y="215" fill="#ca6f1e">Broker</text><text class="n" x="740" y="236">RabbitMQ</text>
  <rect class="s" x="840" y="70" width="140" height="60" rx="10" stroke="#555"/><text class="t" x="910" y="106">Inventario</text>
  <rect class="s" x="840" y="190" width="140" height="60" rx="10" stroke="#555"/><text class="t" x="910" y="226">Notificaciones</text>
  <rect class="s" x="840" y="310" width="140" height="60" rx="10" stroke="#555" stroke-dasharray="6 4"/><text class="t" x="910" y="346" fill="#999">Facturación</text>
  <g stroke="#ca6f1e" stroke-width="2.5" marker-end="url(#o)" fill="none">
    <line x1="660" y1="220" x2="686" y2="220"/>
    <path d="M790,200 L836,105"/><line x1="790" y1="220" x2="836" y2="220"/><path d="M790,240 L836,335"/>
  </g>
  <rect x="540" y="140" width="110" height="30" rx="6" fill="#ffb74d"/><text x="595" y="160" font-size="12" text-anchor="middle">PedidoConfirmado</text>
  <text x="910" y="400" font-size="13" fill="#1e6b3a" text-anchor="middle">(la cola guarda los eventos</text>
  <text x="910" y="416" font-size="13" fill="#1e6b3a" text-anchor="middle">hasta que vuelva)</text>
  <g font-size="14" fill="#145a32">
    <text x="520" y="420">• Pedidos no sabe quién escucha</text>
    <text x="520" y="440">• Los consumidores pueden estar caídos un rato</text>
    <text x="520" y="460">• Nuevo interesado = nueva suscripción</text>
  </g>
</svg>
