<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <style>.s{fill:#fff;stroke:#333;stroke-width:2.5}.t{font-size:15px;font-weight:bold;text-anchor:middle}.e{font-size:12px;fill:#e65100;font-family:monospace}.c{font-size:12px;fill:#1565c0;font-family:monospace}</style>
  <text x="240" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#e65100">Coreografía</text>
  <text x="240" y="52" text-anchor="middle" font-size="13" fill="#555">cada servicio reacciona a eventos y publica los suyos</text>
  <rect class="s" x="40" y="90" width="120" height="55" rx="10"/><text class="t" x="100" y="123">Pedidos</text>
  <rect class="s" x="320" y="90" width="120" height="55" rx="10"/><text class="t" x="380" y="123">Stock</text>
  <rect class="s" x="180" y="270" width="120" height="55" rx="10"/><text class="t" x="240" y="303">Pagos</text>
  <g stroke="#e65100" stroke-width="2.5" fill="none" marker-end="url(#o)">
    <line x1="160" y1="110" x2="316" y2="110"/>
    <path d="M380,145 C380,230 340,280 304,290"/>
    <path d="M180,300 C110,280 90,220 95,149"/>
  </g>
  <text class="e" x="185" y="100">pedido.creado</text>
  <text class="e" x="368" y="215" text-anchor="end">stock.reservado</text>
  <text class="e" x="108" y="225">pago.aceptado</text>
  <g font-size="13" fill="#333"><text x="20" y="365">✔ Sin punto central, muy desacoplado</text><text x="20" y="385">✘ El flujo completo no está escrito en ningún sitio</text><text x="20" y="405">✘ Riesgo de dependencias cíclicas entre servicios</text></g>
  <line x1="490" y1="45" x2="490" y2="410" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="750" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1565c0">Orquestación</text>
  <text x="750" y="52" text-anchor="middle" font-size="13" fill="#555">un orquestador envía comandos y recibe respuestas</text>
  <rect x="680" y="85" width="140" height="60" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/><text class="t" x="750" y="113">Orquestador</text><text x="750" y="132" font-size="12" text-anchor="middle">saga de pedido</text>
  <rect class="s" x="520" y="270" width="110" height="55" rx="10"/><text class="t" x="575" y="303">Pedidos</text>
  <rect class="s" x="695" y="270" width="110" height="55" rx="10"/><text class="t" x="750" y="303">Stock</text>
  <rect class="s" x="870" y="270" width="110" height="55" rx="10"/><text class="t" x="925" y="303">Pagos</text>
  <g stroke="#1565c0" stroke-width="2.5" marker-end="url(#b)" fill="none"><line x1="700" y1="145" x2="590" y2="266"/><line x1="750" y1="145" x2="750" y2="266"/><line x1="800" y1="145" x2="910" y2="266"/></g>
  <text class="c" x="570" y="200">aprobar</text><text class="c" x="757" y="215">reservar</text><text class="c" x="870" y="200">cobrar</text>
  <g font-size="13" fill="#333"><text x="520" y="365">✔ El flujo está en un único lugar, fácil de seguir</text><text x="520" y="385">✔ Más sencillo gestionar compensaciones y timeouts</text><text x="520" y="405">✘ El orquestador concentra lógica y acoplamiento</text></g>
</svg>
