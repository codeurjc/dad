<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <style>.t{font-size:15px;font-weight:bold;text-anchor:middle}.n{font-size:13px;text-anchor:middle;fill:#444}</style>
  <!-- problema -->
  <text x="235" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#b03a2e">Doble escritura ✘</text>
  <rect x="30" y="160" width="140" height="70" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="2.5"/><text class="t" x="100" y="200">Servicio</text>
  <path d="M310,70 a50,15 0 0,0 100,0 a50,15 0 0,0 -100,0 v60 a50,15 0 0,0 100,0 v-60" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2.5"/><text class="t" x="360" y="118">BD</text>
  <rect x="300" y="270" width="120" height="60" rx="10" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2.5"/><text class="t" x="360" y="305" fill="#ca6f1e">Broker</text>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#a)"><line x1="170" y1="180" x2="306" y2="110"/><line x1="170" y1="210" x2="296" y2="290"/></g>
  <text class="n" x="215" y="128">1. INSERT pedido</text><text class="n" x="215" y="282">2. publicar evento</text>
  <text x="240" y="250" font-size="40" text-anchor="middle">⚡</text>
  <g font-size="13" fill="#7b241c"><text x="20" y="372">Si falla entre 1 y 2: pedido guardado, nadie se entera.</text><text x="20" y="392">Si publicamos primero y falla el INSERT: evento falso.</text><text x="20" y="412">No hay transacción común entre la BD y el broker.</text></g>
  <line x1="480" y1="45" x2="480" y2="420" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- solución -->
  <text x="745" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e6b3a">Transactional outbox ✔</text>
  <rect x="510" y="70" width="130" height="70" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="2.5"/><text class="t" x="575" y="110">Servicio</text>
  <rect x="700" y="55" width="270" height="140" rx="12" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2.5"/>
  <text class="t" x="835" y="78">Base de datos</text>
  <rect x="715" y="90" width="115" height="90" rx="6" fill="#fff" stroke="#999"/><text class="n" x="772" y="112" font-weight="bold">orders</text><text class="n" x="772" y="140">P-1 · ana</text>
  <rect x="840" y="90" width="115" height="90" rx="6" fill="#fff" stroke="#ca6f1e"/><text class="n" x="897" y="112" font-weight="bold" fill="#ca6f1e">outbox</text><text class="n" x="897" y="140">evento P-1</text><text class="n" x="897" y="160">publicado: no</text>
  <line x1="640" y1="105" x2="696" y2="105" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="n" x="575" y="165" fill="#1e6b3a" font-weight="bold">1. UNA transacción</text><text class="n" x="575" y="183" fill="#1e6b3a" font-weight="bold">local</text>
  <rect x="790" y="245" width="130" height="60" rx="10" fill="#fff" stroke="#7d3c98" stroke-width="2.5"/><text class="t" x="855" y="272" fill="#7d3c98">Relay</text><text class="n" x="855" y="291">(polling / CDC)</text>
  <line x1="897" y1="195" x2="870" y2="241" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="n" x="915" y="225">2. lee</text>
  <rect x="560" y="330" width="130" height="60" rx="10" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2.5"/><text class="t" x="625" y="365" fill="#ca6f1e">Broker</text>
  <line x1="790" y1="290" x2="694" y2="345" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="n" x="770" y="340">3. publica y marca</text>
  <g font-size="13" fill="#145a32"><text x="510" y="415">Garantía: al menos una vez → consumidores idempotentes</text></g>
</svg>
