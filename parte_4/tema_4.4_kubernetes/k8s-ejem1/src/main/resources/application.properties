spring.application.name=hola

# Sondas /actuator/health/liveness y /actuator/health/readiness
# (se activan solas al detectar Kubernetes; así también funcionan en local)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Al recibir SIGTERM, terminar las peticiones en curso antes de parar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
