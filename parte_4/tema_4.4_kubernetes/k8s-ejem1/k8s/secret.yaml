# Configuración secreta. OJO: en el repositorio solo un valor de ejemplo.
# Los Secrets se guardan en base64, que NO es cifrado: limitar quién puede leerlos (RBAC)
# y activar el cifrado en reposo de etcd. En la práctica se crean desde fuera del repo:
#   kubectl create secret generic hola-secret --from-literal=APP_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: hola-secret
type: Opaque
stringData:
  APP_API_KEY: "valor-de-ejemplo"
