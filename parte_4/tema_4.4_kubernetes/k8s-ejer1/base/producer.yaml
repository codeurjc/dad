apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: dad2425/colas-ejem3-producer
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: usuario
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciales
                  key: password
          # El productor no tiene servidor web: sin sondas HTTP. Si pierde la conexión con
          # RabbitMQ, Spring AMQP reintenta; si el proceso muere, Kubernetes lo reinicia.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 384Mi
