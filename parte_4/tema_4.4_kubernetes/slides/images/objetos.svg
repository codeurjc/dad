<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>.b{font-size:15px;font-weight:bold;text-anchor:middle}.c{font-size:12.5px;text-anchor:middle;fill:#444}</style>
  <rect x="10" y="175" width="110" height="55" rx="8" fill="#eee" stroke="#555"/><text x="65" y="200" class="b">Usuario</text><text x="65" y="218" class="c">notas.localhost</text>
  <rect x="160" y="165" width="130" height="75" rx="8" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/><text x="225" y="193" class="b">Ingress</text><text x="225" y="211" class="c">reglas HTTP por</text><text x="225" y="227" class="c">host y ruta</text>
  <rect x="330" y="165" width="130" height="75" rx="8" fill="#d6eaf8" stroke="#1f4e79" stroke-width="2"/><text x="395" y="193" class="b">Service</text><text x="395" y="211" class="c">notas: nombre DNS</text><text x="395" y="227" class="c">+ IP virtual estable</text>
