  <rect x="690" y="340" width="130" height="80" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/><text x="755" y="368" class="b">Secret</text><text x="755" y="386" class="c">contraseñas,</text><text x="755" y="402" class="c">claves, certificados</text>
  <rect x="860" y="60" width="130" height="90" rx="8" fill="#d6eaf8" stroke="#1f4e79" stroke-width="2"/><text x="925" y="87" class="b">StatefulSet</text><text x="925" y="105" class="c">mysql-0</text><text x="925" y="121" class="c">identidad y</text><text x="925" y="137" class="c">volumen estables</text>
  <rect x="860" y="190" width="130" height="80" rx="8" fill="#eee" stroke="#555" stroke-width="2"/><text x="925" y="217" class="b">PVC → PV</text><text x="925" y="235" class="c">disco que sobrevive</text><text x="925" y="251" class="c">al pod</text>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
