  <rect x="675" y="100" width="120" height="90" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="735" y="125" class="b">Pod</text><text x="735" y="145" class="c">app=notas</text><text x="735" y="162" class="c">10.244.2.4</text><text x="735" y="179" class="c">contenedor(es)</text>
