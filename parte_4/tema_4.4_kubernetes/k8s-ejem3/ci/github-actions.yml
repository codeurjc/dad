# Despliegue continuo de k8s-ejem3 con GitHub Actions.
# Para usarlo en un repositorio propio: copiarlo a .github/workflows/ y ajustar EJEMPLO.
# Necesita el secreto KUBECONFIG (contenido del fichero kubeconfig de un usuario con permisos
# solo sobre el namespace calculo-prod).
name: k8s-ejem3

on:
  push:
    branches: [main]
    paths: ["parte_4/tema_4.4_kubernetes/k8s-ejem3/**"]

env:
  EJEMPLO: parte_4/tema_4.4_kubernetes/k8s-ejem3
  IMAGEN: ghcr.io/${{ github.repository_owner }}/k8s-ejem3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
        working-directory: ${{ env.EJEMPLO }}

  imagen:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Etiqueta inmutable: el hash del commit (nunca "latest" en producción)
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.EJEMPLO }}
          push: true
          tags: ${{ env.IMAGEN }}:${{ github.sha }}

  despliegue:
    needs: imagen
    runs-on: ubuntu-latest
    environment: produccion        # permite exigir aprobación manual en GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: Configurar acceso al clúster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - uses: imranismail/setup-kustomize@v2
      - name: Fijar la imagen recién construida y aplicar
        working-directory: ${{ env.EJEMPLO }}/k8s/overlays/prod
        run: |
          kustomize edit set image codeurjc/k8s-ejem3=${{ env.IMAGEN }}:${{ github.sha }}
          kubectl apply -k .
      - name: Esperar a que termine el rolling update (si falla, se deshace)
        run: |
          kubectl -n calculo-prod rollout status deployment/calculo --timeout=300s \
            || (kubectl -n calculo-prod rollout undo deployment/calculo && exit 1)
