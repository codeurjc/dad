# Producción: versión fijada, más recursos, más réplicas y un Ingress
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: calculo-prod

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# El pipeline de CI/CD cambia esta línea con: kustomize edit set image codeurjc/k8s-ejem3=...:<sha>
images:
  - name: codeurjc/k8s-ejem3
    newTag: v2

configMapGenerator:
  - name: calculo-config
    behavior: replace
    literals:
      - APP_VERSION=v2

patches:
  - path: recursos.yaml
