apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# Genera un ConfigMap con un sufijo que depende de su contenido (calculo-config-7b4f9...).
# Si cambia un valor, cambia el nombre, cambia la plantilla del Deployment
# y Kubernetes hace un rolling update automáticamente.
configMapGenerator:
  - name: calculo-config
    literals:
      - APP_VERSION=v1

images:
  - name: codeurjc/k8s-ejem3
    newTag: v1
