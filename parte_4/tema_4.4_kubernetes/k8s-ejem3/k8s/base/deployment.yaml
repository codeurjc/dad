apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculo
  labels:
    app: calculo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculo
  # Actualización progresiva: nunca menos réplicas de las deseadas, como mucho una de más
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5          # para poder hacer "kubectl rollout undo"
  template:
    metadata:
      labels:
        app: calculo
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: calculo
          image: codeurjc/k8s-ejem3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: calculo-config
          resources:
            requests:
              cpu: 200m              # el HPA calcula el % de uso sobre este valor
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Dar tiempo a que el pod salga de los Endpoints del Service antes de parar
            # (si no, durante un momento le siguen llegando peticiones nuevas)
            preStop:
              sleep:
                seconds: 5
