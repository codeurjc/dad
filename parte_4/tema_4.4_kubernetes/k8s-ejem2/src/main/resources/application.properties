spring.application.name=notas

# Valores para desarrollo local. En Kubernetes se sobrescriben con variables de entorno
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/notas
spring.datasource.username=notas
spring.datasource.password=notas
spring.jpa.hibernate.ddl-auto=update

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
# Si la base de datos no responde, el pod deja de estar "Ready" y no recibe tráfico
# (pero NO se reinicia: la liveness no incluye la base de datos)
management.endpoint.health.group.readiness.include=readinessState,db

server.shutdown=graceful
