# Transparencias de la asignatura. Cada tema las tiene en su carpeta
# `slides/`; esta configuracion es comun a todas. El estilo de codeurjc
# (tema, logo, portada, licencia, indices y ajuste automatico) viene de la
# extension codeurjc/quarto-codeurjc, instalada en `_extensions/codeurjc/`.
# Para actualizarla: quarto add codeurjc/quarto-codeurjc
#
#   quarto render                                   # todas
#   quarto render parte_2/tema_2.6_despliegue/slides/despliegue.qmd
project:
  type: default
  render:
    - "parte_*/*/slides/*.qmd"

# Los mazos convertidos de Impress no parten las lineas largas de codigo: su
# contenido lo encaja el ajuste automatico, y mantienen la numeracion de
# lineas. Los escritos directamente en Quarto lo cambian en su cabecera
# (`wrap-code: true`).
wrap-code: false

# Diapositiva de licencia tras la portada para los mazos que no traen la suya
# (los convertidos de Impress la llevan escrita). El ano sale de `date` o, si
# no la hay, es el actual.
license: "CC BY-SA"
copyright:
  holder: Micael Gallego, Francisco Gortázar, Michel Maes, Óscar Soto e Iván Chicano

format:
  codeurjc-revealjs:
    code-line-numbers: true
    code-overflow: scroll
