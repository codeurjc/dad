  <text x="233" y="170" class="c">HTTPS + token</text>
  <text x="300" y="300" class="c" fill="#ca6f1e">login (code + PKCE)</text>
  <text x="802" y="205" font-size="13" fill="#ca6f1e">client</text><text x="802" y="221" font-size="13" fill="#ca6f1e">credentials</text>
  <text x="520" y="125" class="l">mTLS</text><text x="520" y="250" class="l">mTLS</text><text x="775" y="84" class="l">mTLS</text>
