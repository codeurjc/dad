spring.application.name=pedidos

inventario.url=http://localhost:8081

# Registro "inventario": credenciales del servicio de pedidos en Keycloak.
# El secreto NO debería estar en el repositorio: aquí se toma de una variable de entorno (con un valor de
# ejemplo por defecto). En producción vendría de un gestor de secretos (Vault, Secrets de Kubernetes...).
spring.security.oauth2.client.registration.inventario.provider=keycloak
spring.security.oauth2.client.registration.inventario.client-id=pedidos-service
spring.security.oauth2.client.registration.inventario.client-secret=${PEDIDOS_CLIENT_SECRET:pedidos-secret}
spring.security.oauth2.client.registration.inventario.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/dad/protocol/openid-connect/token
