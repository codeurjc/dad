<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>.p{font-size:18px;font-weight:bold}.e{font-size:14px;font-weight:bold}.l{font-size:12px;fill:#ca6f1e;font-family:monospace}.v{font-size:12px;fill:#1f4e79;font-family:monospace}</style>
  <text x="20" y="75" class="p">A</text><text x="20" y="185" class="p">B</text><text x="20" y="295" class="p">C</text>
  <g stroke="#333" stroke-width="2"><line x1="50" y1="70" x2="960" y2="70" marker-end="url(#a)"/><line x1="50" y1="180" x2="960" y2="180" marker-end="url(#a)"/><line x1="50" y1="290" x2="960" y2="290" marker-end="url(#a)"/></g>
  <text x="965" y="40" font-size="12" fill="#777" text-anchor="end">tiempo de cada proceso →</text>
  <!-- eventos -->
  <g>
    <circle cx="140" cy="70" r="8" fill="#1f4e79"/><text x="132" y="55" class="e">a1</text><text x="160" y="58" class="l">L=1</text><text x="160" y="98" class="v">[1,0,0]</text>
    <circle cx="260" cy="180" r="8" fill="#1f4e79"/><text x="250" y="165" class="e">b1</text><text x="225" y="208" class="l">L=1</text><text x="210" y="225" class="v">[0,1,0]</text>
    <circle cx="200" cy="290" r="8" fill="#1f4e79"/><text x="190" y="275" class="e">c1</text><text x="215" y="318" class="l">L=1</text><text x="200" y="335" class="v">[0,0,1]</text>
    <circle cx="420" cy="180" r="8" fill="#1f4e79"/><text x="410" y="165" class="e">b2</text><text x="430" y="208" class="l">L=2</text><text x="430" y="225" class="v">[1,2,0]</text>
    <circle cx="560" cy="180" r="8" fill="#1f4e79"/><text x="550" y="165" class="e">b3</text><text x="575" y="158" class="l">L=3</text><text x="575" y="208" class="v">[1,3,0]</text>
    <circle cx="760" cy="290" r="8" fill="#1f4e79"/><text x="750" y="275" class="e">c2</text><text x="775" y="318" class="l">L=4</text><text x="760" y="335" class="v">[1,3,2]</text>
  </g>
  <g stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"><line x1="146" y1="76" x2="410" y2="174"/><line x1="566" y1="186" x2="750" y2="284"/></g>
  <text x="270" y="118" font-size="14" fill="#c0392b" font-weight="bold">m1</text><text x="650" y="225" font-size="14" fill="#c0392b" font-weight="bold">m2</text>
  <rect x="760" y="92" width="200" height="52" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="770" y="112" class="l">L = reloj de Lamport</text><text x="770" y="132" class="v">[..] = reloj vectorial</text>
  <text x="20" y="370" font-size="13.5" fill="#333">a1 → b2 → b3 → c2 (cadena de mensajes): [1,0,0] &lt; [1,3,2]. Pero c1 y b3 son concurrentes: [0,0,1] y [1,3,0] no son comparables, aunque Lamport diga 1 &lt; 3.</text>
</svg>
