<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>.h{font-size:16px;font-weight:bold;text-anchor:middle}.t{font-size:13px;font-weight:bold;text-anchor:middle}.n{font-size:12px;text-anchor:middle;fill:#555}</style>
  <!-- etapa 1 -->
  <text x="160" y="28" class="h">1. Monolito</text>
  <rect x="100" y="45" width="120" height="40" rx="8" fill="#fef5e7" stroke="#ca6f1e" stroke-width="2"/><text x="160" y="70" class="t">Fachada / proxy</text>
  <rect x="60" y="130" width="200" height="150" rx="10" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="160" y="160" class="t">Monolito</text>
  <g font-size="12" text-anchor="middle"><text x="160" y="190">catálogo</text><text x="160" y="212">pedidos</text><text x="160" y="234">pagos</text><text x="160" y="256">usuarios</text></g>
  <line x1="160" y1="85" x2="160" y2="126" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <!-- etapa 2 -->
  <text x="500" y="28" class="h">2. Se extrae un servicio</text>
  <rect x="440" y="45" width="120" height="40" rx="8" fill="#fef5e7" stroke="#ca6f1e" stroke-width="2"/><text x="500" y="70" class="t">Fachada / proxy</text>
  <rect x="380" y="130" width="160" height="150" rx="10" fill="#eaf4fb" stroke="#1f4e79" stroke-width="2.5"/><text x="460" y="160" class="t">Monolito</text>
  <g font-size="12" text-anchor="middle"><text x="460" y="190" fill="#bbb" text-decoration="line-through">catálogo</text><text x="460" y="212">pedidos</text><text x="460" y="234">pagos</text><text x="460" y="256">usuarios</text></g>
  <rect x="560" y="150" width="100" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2.5"/><text x="610" y="180" class="t">Catálogo</text>
  <line x1="480" y1="85" x2="465" y2="126" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="530" y1="85" x2="595" y2="146" stroke="#1e8449" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="610" y="110" class="n" fill="#1e8449">/catalogo/**</text>
  <!-- etapa 3 -->
  <text x="840" y="28" class="h">3. El monolito desaparece</text>
  <rect x="780" y="45" width="120" height="40" rx="8" fill="#fef5e7" stroke="#ca6f1e" stroke-width="2"/><text x="840" y="70" class="t">API Gateway</text>
  <g><rect x="715" y="140" width="110" height="40" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="770" y="165" class="t">Catálogo</text>
  <rect x="855" y="140" width="110" height="40" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="910" y="165" class="t">Pedidos</text>
  <rect x="715" y="220" width="110" height="40" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="770" y="245" class="t">Pagos</text>
  <rect x="855" y="220" width="110" height="40" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text x="910" y="245" class="t">Usuarios</text></g>
  <g stroke="#1e8449" stroke-width="2" marker-end="url(#a)"><line x1="820" y1="85" x2="780" y2="136"/><line x1="860" y1="85" x2="900" y2="136"/></g>
  <text x="500" y="318" class="n" font-size="13">Como la higuera estranguladora: el sistema nuevo crece alrededor del viejo hasta sustituirlo, sin un "big bang"</text>
</svg>
