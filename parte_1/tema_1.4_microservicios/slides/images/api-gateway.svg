<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>.t{font-size:15px;font-weight:bold;text-anchor:middle}.n{font-size:13px}</style>
  <rect x="30" y="60" width="130" height="55" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text class="t" x="95" y="93">Web (SPA)</text>
  <rect x="30" y="160" width="130" height="55" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text class="t" x="95" y="193">App móvil</text>
  <rect x="30" y="260" width="130" height="55" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text class="t" x="95" y="293">Socios (API)</text>
  <rect x="290" y="50" width="250" height="275" rx="14" fill="#fef5e7" stroke="#ca6f1e" stroke-width="3"/>
  <text class="t" x="415" y="80" fill="#ca6f1e" font-size="18">API Gateway</text>
  <g class="n"><text x="310" y="115">• Enrutado: /api/pedidos → Pedidos</text><text x="310" y="142">• Autenticación (JWT, OAuth2)</text><text x="310" y="169">• TLS, CORS</text><text x="310" y="196">• Límite de peticiones (rate limit)</text><text x="310" y="223">• Logs, métricas, X-Request-Id</text><text x="310" y="250">• Composición de respuestas</text><text x="310" y="277">• Traducción de protocolos</text><text x="310" y="304">• Caché</text></g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)"><line x1="160" y1="88" x2="286" y2="140"/><line x1="160" y1="188" x2="286" y2="188"/><line x1="160" y1="288" x2="286" y2="236"/></g>
  <rect x="660" y="20" width="310" height="340" rx="14" fill="#fafafa" stroke="#bbb" stroke-dasharray="8 6"/><text x="955" y="42" font-size="12" fill="#888" text-anchor="end">red interna</text>
  <g><rect x="700" y="60" width="150" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text class="t" x="775" y="90">Catálogo</text>
  <rect x="700" y="160" width="150" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text class="t" x="775" y="190">Pedidos</text>
  <rect x="700" y="260" width="150" height="50" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/><text class="t" x="775" y="290">Usuarios</text></g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)"><line x1="540" y1="130" x2="696" y2="88"/><line x1="540" y1="188" x2="696" y2="185"/><line x1="540" y1="246" x2="696" y2="282"/></g>
  <text x="880" y="190" font-size="12" fill="#555">no expuestos</text><text x="880" y="206" font-size="12" fill="#555">a Internet</text>
</svg>
