spring.application.name=pedidos
server.port=8082
catalogo.url=http://localhost:8081

# Resiliencia de las llamadas al catálogo
catalogo.connect-timeout=500ms
catalogo.read-timeout=1s
catalogo.retry.max-attempts=3
catalogo.retry.initial-backoff=100ms
catalogo.circuit-breaker.failure-threshold=0.5
catalogo.circuit-breaker.window-size=10
catalogo.circuit-breaker.open-duration=10s
catalogo.bulkhead.max-concurrent-calls=10
