# Los dos servicios del ejemplo 1 detrás de un API Gateway.
# Solo el gateway publica un puerto: los servicios no son accesibles desde fuera.
#   docker compose up --build
#   curl -i localhost:8080/api/catalogo/products
#   curl -i -X POST localhost:8080/api/pedidos/orders -H 'Content-Type: application/json' -d '{"productId":1,"quantity":1}'
services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - CATALOGO_URL=http://catalogo:8081
      - PEDIDOS_URL=http://pedidos:8082
  catalogo:
    build: ../micro-ejem1/catalogo
  pedidos:
    build: ../micro-ejem1/pedidos
    environment:
      - CATALOGO_URL=http://catalogo:8081
