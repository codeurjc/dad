spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: libros
              uri: ${LIBROS_URL:http://localhost:8081}
              predicates:
                - Path=/api/libros/**
              filters:
                - StripPrefix=2
            - id: prestamos
              uri: ${PRESTAMOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/prestamos/**
              filters:
                - StripPrefix=2

server:
  port: 8080
